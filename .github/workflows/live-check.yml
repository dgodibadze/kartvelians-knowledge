name: live-check

# Hourly check that https://kartvelians.com/mcp is up and answering correctly.
# A failed run makes GitHub email the repo owner (Settings, Notifications, Actions).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live MCP test (one retry after 2 minutes)
        run: |
          probe() {
            curl -s -o /dev/null -w "POST /mcp -> HTTP %{http_code}\n" -X POST https://kartvelians.com/mcp \
              -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          }
          probe
          if node scripts/test-search.mjs https://kartvelians.com/mcp; then exit 0; fi
          echo "First attempt failed. Retrying in 2 minutes to rule out a brief blip."
          sleep 120
          probe
          node scripts/test-search.mjs https://kartvelians.com/mcp

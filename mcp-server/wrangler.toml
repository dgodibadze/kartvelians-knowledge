name = "kartvelians-knowledge-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Serve only https://kartvelians.com/mcp. The exact-path route runs before the site Worker,
# which keeps every other path. No workers.dev URL, no bindings, no secrets.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "kartvelians.com/mcp", zone_name = "kartvelians.com" }
]

[observability]
enabled = true
